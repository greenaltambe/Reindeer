name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The medicine database is too big and its source data is not in the repo,
      # so it is git-ignored. An empty placeholder satisfies the pubspec asset
      # check; tests that need the real database skip themselves when it is empty.
      - name: Placeholder medicine database
        run: |
          mkdir -p assets/db
          touch assets/db/medicines.db.gz

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
