name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # A release must contain the real medicine database. It is git-ignored by
      # default; to release from CI, commit assets/db/medicines.db.gz (remove it
      # from .gitignore) after running tools/build_medicine_db.py.
      - name: Check medicine database
        run: |
          if [ ! -s assets/db/medicines.db.gz ]; then
            echo "::error::assets/db/medicines.db.gz is missing. See docs/DATA.md."
            exit 1
          fi

      - name: Write Firebase secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_ANDROID_API_KEY: ${{ secrets.FIREBASE_ANDROID_API_KEY }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          # Accepts the raw JSON, or base64 of it (stray spaces/quotes are ignored).
          if [[ "$GOOGLE_SERVICES_JSON" == \{* ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d ' \t\r\n"' | base64 -d > android/app/google-services.json
          fi
          python3 -c "import json; json.load(open('android/app/google-services.json'))" \
            || { echo "::error::GOOGLE_SERVICES_JSON secret is not valid JSON/base64"; exit 1; }
          printf '{"FIREBASE_ANDROID_API_KEY":"%s"}' "$FIREBASE_ANDROID_API_KEY" > env.json
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n"' | base64 -d > "$RUNNER_TEMP/release.jks" \
            || { echo "::error::KEYSTORE_BASE64 secret is not valid base64"; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=reindeer\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "$RUNNER_TEMP/release.jks" > android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
