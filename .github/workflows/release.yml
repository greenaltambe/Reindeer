name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # A release must contain the real medicine database. It is git-ignored by
      # default; to release from CI, commit assets/db/medicines.db.gz (remove it
      # from .gitignore) after running tools/build_medicine_db.py.
      - name: Check medicine database
        run: |
          if [ ! -s assets/db/medicines.db.gz ]; then
            echo "::error::assets/db/medicines.db.gz is missing. See docs/DATA.md."
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
